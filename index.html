<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#455873" />
    <title>Tabby Games</title>
    <style>
      @font-face { font-family: 'Barlow'; font-weight: 500; font-style: normal; font-display: block; src: url('/assets/fonts/Barlow-500.woff2') format('woff2'); }
      @font-face { font-family: 'Barlow'; font-weight: 600; font-style: normal; font-display: block; src: url('/assets/fonts/Barlow-600.woff2') format('woff2'); }
      @font-face { font-family: 'Barlow'; font-weight: 700; font-style: normal; font-display: block; src: url('/assets/fonts/Barlow-700.woff2') format('woff2'); }
      @font-face { font-family: 'Barlow Condensed'; font-weight: 600; font-style: normal; font-display: block; src: url('/assets/fonts/BarlowCondensed-600.woff2') format('woff2'); }
      @font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-style: normal; font-display: block; src: url('/assets/fonts/BarlowCondensed-700.woff2') format('woff2'); }
      html, body { margin: 0; height: 100%; background: #455873; overflow: hidden; overscroll-behavior: none; }
      body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
